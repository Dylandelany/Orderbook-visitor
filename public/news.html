<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>News Terminal</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #000;
    color: #f0a020;
    font-family: "Courier New", Consolas, monospace;
    margin: 0;
    padding: 0;
    letter-spacing: 0.2px;
  }
  .topbar {
    background: #4a0000; /* merah tua, kesan jadul */
    border-bottom: 2px solid #2a0000;
    padding: 8px 16px;
    color: #fff;
    font-weight: bold;
    font-size: 14px;
  }
  .topbar span {
    margin-right: 24px;
    color: #e0b978;
    font-weight: normal;
  }
  .searchbar {
    background: #a8681f; /* oranye tua/kusam, bukan oranye terang modern */
    border-bottom: 2px solid #6e4514;
    padding: 8px 16px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .searchbar input {
    flex: 1;
    background: #000;
    border: 1px solid #3a2000;
    color: #f0a020;
    font-family: "Courier New", Consolas, monospace;
    font-size: 14px;
    padding: 8px 10px;
  }
  .searchbar button {
    background: #000;
    color: #f0a020;
    border: 1px solid #f0a020;
    padding: 8px 16px;
    font-family: "Courier New", Consolas, monospace;
    cursor: pointer;
  }
  .searchbar button:hover {
    background: #f0a020;
    color: #000;
  }
  .status {
    color: #6e7681;
    padding: 8px 16px;
    font-size: 12px;
    border-bottom: 1px solid #262626;
  }
  .newslist {
    max-width: 1100px;
    margin: 0 auto;
  }
  .newsrow {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 9px 16px;
    border-bottom: 1px solid #262626; /* sekat antar baris */
    font-size: 14px;
  }
  .newsrow:hover {
    background: #16233a; /* highlight biru gelap ala baris terpilih di Bloomberg */
  }
  .newsrow .idx {
    color: #6e7681;
    width: 26px;
    flex-shrink: 0;
    text-align: right;
  }
  .newsrow .title a {
    flex: 1;
    color: #f0a020;
    text-decoration: none;
  }
  .newsrow .title a:hover {
    text-decoration: underline;
    color: #ffc966;
  }
  .newsrow .title {
    flex: 1;
  }
  .newsrow .source {
    color: #8b949e;
    width: 130px;
    text-align: right;
    font-size: 12px;
    flex-shrink: 0;
    border-left: 1px solid #262626; /* sekat antar kolom */
    padding-left: 12px;
  }
  .newsrow .time {
    color: #4ea8de;
    width: 46px;
    text-align: right;
    font-size: 12px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="topbar">
    Search News <span>Actions</span><span>Custom Searches</span><span>Key Themes</span>
  </div>
  <div class="searchbar">
    <input id="q" placeholder="Ketik nama company, misal: Boeing, BBCA, Telkom Indonesia..." onkeydown="if(event.key==='Enter') loadNews()" />
    <button onclick="loadNews()">Search</button>
  </div>
  <div class="status" id="status"></div>
  <div class="newslist" id="list"></div>

<script>
async function loadNews() {
  const q = document.getElementById('q').value || '';
  const status = document.getElementById('status');
  const list = document.getElementById('list');
  status.textContent = 'Loading...';
  list.innerHTML = '';
  try {
    const r = await fetch('/api/news-data?q=' + encodeURIComponent(q));
    const data = await r.json();
    status.textContent = data.ok
      ? 'Showing news for: ' + data.query
      : 'Tidak ada berita ditemukan untuk: ' + data.query;
    data.news.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'newsrow';

      const idx = document.createElement('div');
      idx.className = 'idx';
      idx.textContent = (i + 1) + ')';

      const title = document.createElement('div');
      title.className = 'title';
      const link = document.createElement('a');
      link.href = item.link || '#';
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = item.title;
      title.appendChild(link);

      const source = document.createElement('div');
      source.className = 'source';
      source.textContent = item.source;

      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = item.time;

      row.appendChild(idx);
      row.appendChild(title);
      row.appendChild(source);
      row.appendChild(time);
      list.appendChild(row);
    });
  } catch (e) {
    status.textContent = 'Error loading news.';
  }
}
loadNews();
</script>
</body>
</html>
